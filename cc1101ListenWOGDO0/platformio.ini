[platformio]
default_envs = test

[env:test]
platform = espressif32
board = esp32dev
framework = arduino
build_type = debug
monitor_filters = esp32_exception_decoder

monitor_speed = 9600

lib_deps =
    LSatan/SmartRC-CC1101-Driver-Lib @ ^3.0.2
    https://github.com/Martin-Laclaustra/rc-switch.git#4f81b63c06cce9d49608a58f5a85f587643b96b6