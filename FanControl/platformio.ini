[platformio]
default_envs = fanControl
extra_configs = platformio.local.ini

[env:fanControl]
platform = espressif32
board = esp32dev
# platform = espressif8266
# board = d1_mini
framework = arduino

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    LSatan/SmartRC-CC1101-Driver-Lib @ ^3.0.2
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    -DWIFI_SSID=\"${secrets.wifi_ssid}\"
    -DWIFI_PASSWORD=\"${secrets.wifi_pw}\"
    -DMQTT_BROKER=\"${secrets.mqtt_broker}\"
    -DMQTT_PORT=\"${secrets.mqtt_port}\"
    -DMQTT_USER=\"${secrets.mqtt_user}\"
    -DMQTT_PASSWORD=\"${secrets.mqtt_password}\"
    -DOTA_PASSWORD=\"${secrets.ota_pw}\"

[env:fanControlOTA]
extends = env:fanControl
upload_protocol = espota
upload_flags = --auth=${secrets.ota_pw}