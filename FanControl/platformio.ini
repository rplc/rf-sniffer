[env:d1_mini]
platform  = espressif8266
board     = d1_mini
framework = arduino

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    LSatan/SmartRC-CC1101-Driver-Lib @ ^2.5.7
    bblanchon/ArduinoJson @ ^6.21.5

; OTA – Zugangsdaten in platformio.local.ini (nicht einchecken!)
; upload_protocol = espota
; upload_port     = <IP>
; upload_flags    = --auth=${credentials.ota_password}
