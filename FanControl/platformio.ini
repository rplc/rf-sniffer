[platformio]
default_envs = fanControl
extra_configs = platformio.local.ini

[env:fanControl]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
# monitor_dtr    = 0      ; verhindert ESP32-Reset beim Öffnen des Serial Monitors
# monitor_rts    = 0

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    fastled/FastLED @ 3.10.3
    jgromes/RadioLib @ 7.7.1

build_flags =
    -DWIFI_SSID=\"${secrets.wifi_ssid}\"
    -DWIFI_PASSWORD=\"${secrets.wifi_pw}\"
    -DMQTT_BROKER=\"${secrets.mqtt_broker}\"
    -DMQTT_USER=\"${secrets.mqtt_user}\"
    -DMQTT_PASSWORD=\"${secrets.mqtt_password}\"
    -DOTA_PASSWORD=\"${secrets.ota_pw}\"

[env:fanControlOTA]
extends = env:fanControl
upload_protocol = espota
upload_flags = --auth=${secrets.ota_pw}